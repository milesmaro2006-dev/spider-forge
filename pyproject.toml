[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spiderforge"
version = "0.1.0"
description = "SpiderForge — Personal Web Security Assessment Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SpiderForge" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pydantic>=2.7.0",
    "SQLAlchemy>=2.0.30",
    "PyYAML>=6.0.1",
    "Jinja2>=3.1.3",
    "dnspython>=2.6.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.44.0"]
pdf = ["weasyprint>=62.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpserver>=1.0.12",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML",
    "build>=1.2.0",
]

[project.scripts]
spiderforge = "spiderforge.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["spiderforge"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"