[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spiderforge"
version = "2.0.0"
description = "SpiderForge — Advanced Web Reconnaissance & Security Assessment Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Spidey", email = "spidey@redteam.local" }]
keywords = ["security", "pentest", "recon", "web", "xss", "sqli", "kali"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# ─── Core deps (CLI فقط) ───
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pydantic>=2.7.0",
    "SQLAlchemy>=2.0.30",
    "PyYAML>=6.0.1",
    "Jinja2>=3.1.3",
    "dnspython>=2.6.1",
]

[project.optional-dependencies]
# الويب (FastAPI + uvicorn)
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]
# PDF (يحتاج system libs — موضّحة في README)
pdf = [
    "weasyprint>=62.0",
]
# Playwright (لمتصفح متقدم / DOM XSS)
browser = [
    "playwright>=1.44.0",
]
# كل حاجة اختيارية مع بعض
all = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "weasyprint>=62.0",
]
# للتطوير
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpserver>=1.0.12",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML",
    "build>=1.2.0",
]

[project.scripts]
spiderforge = "spiderforge.cli.main:app"

[project.urls]
Homepage = "https://github.com/yourname/spiderforge"
Issues = "https://github.com/yourname/spiderforge/issues"

# ═══════════════════════════════════════════════════════════════
#  Hatchling build config
# ═══════════════════════════════════════════════════════════════

[tool.hatch.build.targets.wheel]
packages = ["spiderforge", "backend"]

[tool.hatch.build.targets.sdist]
include = [
    "/spiderforge",
    "/backend",
    "/frontend",
    "/README.md",
    "/pyproject.toml",
    "/install.sh",
]

# ═══════════════════════════════════════════════════════════════
#  Ruff / Mypy / Pytest
# ═══════════════════════════════════════════════════════════════

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
